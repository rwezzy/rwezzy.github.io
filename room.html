<template id="page-about">
  <p class="den-kicker">01 · About</p>
  <h1>I'm Keith, a computer engineering student at NJIT.</h1>
  <div class="den-cols">
    <div>
      <p>I am from Kampala, Uganda, and my interest in computer engineering developed alongside my interests in biology and ethics. I am particularly interested in how machines can extend human capabilities, and in the conditions that determine whether they are useful to the people expected to rely on them.</p>
      <p>These interests have informed my work on gaze-controlled robotics, gesture recognition on microcontrollers, and machine learning research. Working within the memory and processing constraints of these systems has also made me more interested in computer architecture, as the capabilities of a model are dependent on the hardware available to implement it. I am consequently exploring hardware research alongside my work in AI.</p>
    </div>
    <div>
      <ul class="den-now">
        <li>exploring hardware research at NJIT</li>
        <li>developing OmniRing, a gesture ring with a 4 KB neural network</li>
        <li>open to internships in computer architecture, digital design, embedded systems, and ML systems</li>
      </ul>
      <ul class="den-facts">
        <li><b>1st</b> place, Viam robotics hackathon</li>
        <li><b>Dean's List</b>, Albert Dorman Honors College</li>
        <li><b>180+</b> students at the school supported by Urban Arbor</li>
      </ul>
    </div>
  </div>
</template>

<template id="page-projects">
  <p class="den-kicker">02 · Projects</p>
  <h1>Things I've built</h1>
  <div class="den-projects">
    <article>
      <p class="den-meta">Hardware · software · Nov 2026</p>
      <h2>SoundScope</h2>
      <p>A ringing phone provides a useful indication of its location, but this assumes that the person looking for it can distinguish the direction of the sound. I built SoundScope to represent that direction visually, using a Seeed reSpeaker XVF3800 microphone array and an Orbbec Gemini 2 depth camera.</p>
      <p class="den-links"><a href="index.html#soundscope-lab">Try the room demo</a><a href="https://github.com/rwezzy/soundscope" target="_blank" rel="noopener">Code ↗</a></p>
    </article>
    <article>
      <p class="den-meta">Winner, Viam "Fine Motor Skills" robotics hackathon · Sept 2026</p>
      <h2>Gaze Arm</h2>
      <p>At the Viam hackathon, I proposed a robot arm that could receive instructions through gaze, potentially allowing someone with limited hand mobility to select and retrieve an object. Looking at an object selects it for pickup, while looking at an empty position specifies where to place it.</p>
      <p class="den-links"><a href="index.html#try">Try it with your eyes</a><a href="https://github.com/rwezzy/gaze-arm" target="_blank" rel="noopener">Code ↗</a></p>
    </article>
    <article>
      <p class="den-meta">VAST Builders Challenge, NYC · Oct 2026</p>
      <h2>ZoneLogic &amp; Occlusive Logic</h2>
      <p>I built ZoneLogic independently in one day at the VAST Builders Challenge in New York. The system allows a user to define a region within a fixed camera view and specify the conditions under which detections in a video archive should constitute an incident.</p>
      <p class="den-links"><a href="index.html#zonelogic">Run a rule on street footage</a><a href="https://github.com/rwezzy/ZoneLogic-Tripwire" target="_blank" rel="noopener">Code ↗</a></p>
    </article>
    <article>
      <p class="den-meta">TinyML · Aug 2026 – now · in progress</p>
      <h2>OmniRing</h2>
      <p>I am developing OmniRing as a gesture-based computer interface in which hand movements are measured by a six-axis motion sensor, rather than inferred from camera images. Quantization to 8-bit integers reduces the model to approximately 4 KB, with a 1.4 KB memory arena for inference.</p>
      <p class="den-links"><a href="index.html#omniring">Draw a gesture</a></p>
    </article>
    <article>
      <p class="den-meta">Research · NJIT · Sept – Dec 2025</p>
      <h2>Optical deconvolution</h2>
      <p>This project investigated the restoration of optical images affected by depth-dependent blur. I trained a 54.6k-parameter complex-valued neural network using experimental data comprising 1024&times;1024&times;128 samples per depth across nine depths.</p>
      <p class="den-links"><a href="index.html#optics">Deblur a chart in your browser</a></p>
    </article>
    <article>
      <p class="den-meta">Software · Aug 2025</p>
      <h2>Einstein, a tutoring chatbot</h2>
      <p>I built Einstein using Gemini 2.5 Flash, LangChain and Gradio to structure explanations around a student's existing understanding.</p>
      <p class="den-links"><a href="https://github.com/rwezzy/Einstein" target="_blank" rel="noopener">Code ↗</a></p>
    </article>
  </div>
</template>

<template id="page-research">
  <p class="den-kicker">03 · Research</p>
  <h1>Research at NJIT</h1>
  <p class="den-lede">My research at NJIT has involved machine learning for optical image restoration and gaze estimation, with more recent exploration of hardware research. These projects have required me to consider both the information available to a model and the computational constraints under which it is implemented.</p>
  <div class="den-cols den-cols--3">
    <div><p class="den-meta">Hardware · Oct 2026 – now</p><h2>Hardware research</h2><p>I began exploring two hardware labs at NJIT in October 2026, with the intention of understanding their respective research areas before committing to one. This work is still at an introductory stage.</p></div>
    <div><p class="den-meta">Software · Mar 2026 – now</p><h2>Gaze estimation with a depth camera</h2><p>This project investigates whether the inclusion of depth information can improve screen-based gaze estimation, particularly when the model is applied to people not represented in its training data. Since depth has not yet been incorporated, any improvement from its inclusion remains to be established.</p></div>
    <div><p class="den-meta">Software · Sept – Dec 2025</p><h2>Optical deconvolution</h2><p>My first research project at NJIT concerned optical deconvolution, for which I studied Fourier optics and developed a complex-valued neural network.</p></div>
  </div>
</template>
